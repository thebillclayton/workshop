<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Next Home. Your Whole Budget. | Live Workshop with Bill Clayton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #0B111D;
      --bg-card: #152238;
      --bg-card-subtle: #1B2B46;
      --border-card: #223656;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --brand-red: #D9222A;
      --brand-gold: #F59E0B;
      --brand-green: #10B981;
      --input-bg: #0C1524;
      --input-border: #2D4263;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .badge-bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(217, 34, 42, 0.15);
      border: 1px solid rgba(217, 34, 42, 0.35);
      color: #FCA5A5;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      align-self: flex-start;
      letter-spacing: 0.02em;
    }

    .header-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #FFFFFF;
    }
